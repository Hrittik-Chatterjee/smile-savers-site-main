# ═══════════════════════════════════════════════════════════════════════════════
# Smile Savers Dental — CI Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Deployment is NOT done here. Cloudflare's own Git integration (Workers
# Builds) watches this repo directly and deploys automatically on every
# push — no CLOUDFLARE_API_TOKEN, no cloudflare/pages-action, no GitHub
# Actions step required. It posts its own PR comment with commit/branch
# preview URLs (see the "Deploying with Cloudflare Workers" bot comments on
# any PR) and its own commit status check, independent of this workflow.
# The cloudflare/pages-action-based jobs that used to live here targeted a
# different deployment mechanism (Cloudflare Pages) than what's actually
# configured for this project (Cloudflare Workers + Workers Static Assets,
# per wrangler.jsonc's main/assets shape) and were failing on every run
# with "Input required and not supplied: apiToken" — see
# audit/cloudflare-decision/ for the full evidence trail on why Workers,
# not Pages, is this project's real deployment target.
#
# Triggers:
#   push main    → type-check → build (validation only; Cloudflare deploys separately)
#   pull_request → type-check → build (validation only; Cloudflare deploys its own preview)
#   workflow_dispatch → manual trigger for any branch
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Job: Quality Gate ─────────────────────────────────────────────────────────
jobs:
  quality:
    name: 🔍 Type-check & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check
        run: npm run check

      - name: Format check
        run: npx prettier --check "src/**/*.{astro,ts,css}" --log-level warn
        continue-on-error: true   # warn only, don't block

# ── Job: Build ────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build:ci
        env:
          NODE_ENV: production
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          GITHUB_BRANCH: main

      - name: Report bundle sizes
        run: |
          echo "## 📦 Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/_astro/ >> $GITHUB_STEP_SUMMARY
          ls -lh dist/_astro/*.css | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

# ── Job: Lighthouse Audit (main branch only) ──────────────────────────────────
# Runs against the live domain, decoupled from any deploy step in this
# workflow — Cloudflare's own Git integration deploys on the same push
# this job triggers on, so by the time this job's wait completes,
# production should already reflect this commit. This audits production
# as it actually is; it does not gate or perform the deployment itself.
  lighthouse:
    name: 🏠 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Cloudflare deployment
        run: sleep 60

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://dentalsmilesavers.com/
            https://dentalsmilesavers.com/services
            https://dentalsmilesavers.com/appointments
            https://dentalsmilesavers.com/contact
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true   # informational only, never blocks

      - name: Lighthouse score summary
        run: echo "Lighthouse results uploaded to temporary public storage. Check Actions artifacts."
